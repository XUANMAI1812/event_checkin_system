# Nginx site config: routing + rate limit for the two services
# Replace YOUR_HOSTNAME, then run: sudo certbot --nginx -d YOUR_HOSTNAME
# Certbot adds the 443 server block and the HTTP -> HTTPS redirect

# Rate limit for /events: 5 requests/s per client IP (burst 10)
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/s;

server {
    listen 80;
    server_name YOUR_HOSTNAME;

    client_max_body_size 2m;

    location /events {
        limit_req zone=register_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health-registration {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /checkin {
        proxy_pass http://127.0.0.1:8001/checkin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health-checkin {
        proxy_pass http://127.0.0.1:8001/health;
    }
}
