name: CI - checkin-service

on:
  push:
    branches: [main]
    paths:
      - "checkin-service/**"
      - ".github/workflows/ci-checkin-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "checkin-service/**"
      - ".github/workflows/ci-checkin-service.yml"

defaults:
  run:
    working-directory: checkin-service

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: checkin-service
          push: false
          tags: ghcr.io/xuanmai1812/event_checkin_system/checkin-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
